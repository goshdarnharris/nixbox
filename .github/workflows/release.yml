name: Release CI

on:
  push:
    branches: [ "nixos-**" ]

jobs:
  build:
    name: Run build ${{ matrix.BUILDER }} ${{ matrix.ARCH }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILDER: ['virtualbox-iso.virtualbox']
        ARCH: ['x86_64']
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: ${{matrix.BUILDER == 'virtualbox-iso.virtualbox'}}
      run: |
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
        wget -O- https://www.virtualbox.org/download/oracle_vbox_2016.asc | sudo gpg --yes --output /usr/share/keyrings/oracle-virtualbox-2016.gpg --dearmor
        sudo apt-get update
        sudo apt-get install -y virtualbox-7.1

    - name: Install dependencies
      if: ${{matrix.BUILDER == 'qemu.qemu'}}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            qemu-system-x86 \
            libvirt-daemon-system

    - name: Install dependencies
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get install -y jq hcp

    - name: Get HCP access token
      env:
        HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
        HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
      run: |
        sudo -E hcp auth login --client-id=$HCP_CLIENT_ID --client-secret=$HCP_CLIENT_SECRET
        echo "ATLAS_TOKEN=\";$(sudo -E hcp auth print-access-token)\"" >> $GITHUB_ENV

    - name: Create Vagrant Cloud Box
      env:
        REPO: gdharris/nixos
      run: make vagrantcloud-create

    - name: Set Vagrant Cloud Box is Public
      env:
        REPO: gdharris/nixos
      run: make vagrantcloud-update

    - name: Delete Old Vagrant Cloud Box Version
      env:
        REPO: gdharris/nixos
      run: VERSION=${GITHUB_REF#refs/heads/nixos-} make vagrantcloud-delete

    - name: Setup `packer`
      uses: hashicorp/setup-packer@main
      id: setup
      with:
        version: "latest"

    - name: Run build ${{ matrix.BUILDER }} ${{ matrix.ARCH }} and push box to vagrant cloud
      env:
        REPO: gdharris/nixos
      run: |
        sudo make REPO=${REPO} ATLAS_TOKEN=${ATLAS_TOKEN} VERSION=${GITHUB_REF#refs/heads/nixos-} BUILDER=${{ matrix.BUILDER }} packer-build 
